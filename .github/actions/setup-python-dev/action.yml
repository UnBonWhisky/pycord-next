name: "Setup Python dev environment"
description: "Set up Python and install development dependencies with uv."

inputs:
  python-version:
    description: "Python version to install."
    required: true
  install-voice:
    description: "Install the voice extra."
    required: false
    default: "false"
  extras:
    description: "Comma separated extras to install (e.g. voice,redis)."
    required: false
    default: ""
  groups:
    description: "Space separated dependency groups to install."
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: "Setup Python"
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements/*.txt

    - name: "Install uv"
      shell: bash
      run: python -m pip install --upgrade pip uv

    - name: "Install dependencies"
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        INSTALL_VOICE: ${{ inputs.install-voice }}
        GROUPS_TO_INSTALL: ${{ inputs.groups }}
      run: |
        if [[ "$INSTALL_VOICE" == "true" && ",$EXTRAS," != *",voice,"* ]]; then
          EXTRAS="${EXTRAS:+$EXTRAS,}voice"
        fi
        TARGET="."
        if [[ -n "$EXTRAS" ]]; then
          TARGET=".[$EXTRAS]"
        fi
        ARGS=()
        for group in $GROUPS_TO_INSTALL; do
          ARGS+=(--group "$group")
        done
        uv pip install --system "$TARGET" "${ARGS[@]}"
